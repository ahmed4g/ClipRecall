name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libglib2.0-bin gjs zip dbus-daemon
      - name: Build daemon
        run: cargo build --release --locked
      - name: Test daemon on a private bus
        run: cargo test --locked
      - name: Check extension logic
        run: |
          gjs -m tests/testSyntax.js
          gjs -m tests/testFilters.js
          gjs -m tests/testDbusSignatures.js
          gjs -m tests/testPopupLogic.js
      - name: Package extension
        run: make pack
